<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBank - Loan EMI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">🏦 SmartBank</div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="emi.html" class="active">Loan EMI</a>
      <a href="fd.html">FD Calculator</a>
      <a href="goal.html">Savings Goal</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <section class="banner emi-bg">
    <h1>💳 Loan EMI Calculator</h1>
    <p>Find your monthly payment before you borrow</p>
  </section>

  <div class="box">
    <label>Loan Amount (₹)</label>
    <input type="number" id="loanAmount" placeholder="e.g. 500000">

    <label>Interest Rate (% per year)</label>
    <input type="number" id="loanRate" placeholder="e.g. 9">

    <label>Duration (years)</label>
    <input type="number" id="loanYears" placeholder="e.g. 5">

    <button class="btn" onclick="calculateEMI()">Calculate EMI</button>
    <div id="emiResult" class="result"></div>
  </div>

  <footer>&copy; 2026 SmartBank Toolkit | Mini Project made with HTML, CSS &amp; JavaScript</footer>

  <script src="script.js"></script>
</body>
</html>
