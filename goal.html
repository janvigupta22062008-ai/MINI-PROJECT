<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBank - Savings Goal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">🏦 SmartBank</div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="emi.html">Loan EMI</a>
      <a href="fd.html">FD Calculator</a>
      <a href="goal.html" class="active">Savings Goal</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <section class="banner goal-bg">
    <h1>🎯 Savings Goal Planner</h1>
    <p>Find out exactly when you can afford what you want</p>
  </section>

  <div class="box">
    <label>What are you saving for?</label>
    <input type="text" id="goalName" placeholder="e.g. New laptop">

    <label>Target Amount (₹)</label>
    <input type="number" id="goalTarget" placeholder="e.g. 60000">

    <label>Already Saved (₹)</label>
    <input type="number" id="goalSaved" placeholder="e.g. 10000">

    <label>You can save per month (₹)</label>
    <input type="number" id="goalMonthly" placeholder="e.g. 2500">

    <button class="btn" onclick="calculateGoal()">Plan My Goal</button>
    <div id="goalResult" class="result"></div>
  </div>

  <footer>&copy; 2026 SmartBank Toolkit | Mini Project made with HTML, CSS &amp; JavaScript</footer>

  <script src="script.js"></script>
</body>
</html>
